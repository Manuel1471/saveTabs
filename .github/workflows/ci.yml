name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate-extension:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest
        run: |
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (manifest.manifest_version !== 3) throw new Error('Manifest V3 is required'); if (!manifest.version) throw new Error('A version is required'); console.log('Manifest valid:', manifest.version);"

      - name: Check JavaScript syntax
        run: |
          node --check popup.js
          node --check background.js

      - name: Check secure DOM rendering
        run: |
          if rg -n 'innerHTML|outerHTML|insertAdjacentHTML' popup.js saveTabs.html background.js; then
            echo 'Unsafe HTML insertion API found.' >&2
            exit 1
          fi

      - name: Validate Firefox package contents
        run: |
          zip -r save-tabs-ci.zip manifest.json saveTabs.html popup.css popup.js background.js saveTabs.png README.md CHANGELOG.md LICENSE
          unzip -l save-tabs-ci.zip | rg 'manifest.json|saveTabs.html|popup.js|background.js'
          unzip -p save-tabs-ci.zip manifest.json | node -e "let content = ''; process.stdin.on('data', chunk => content += chunk).on('end', () => JSON.parse(content));"
